<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sanctum">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<title>Sanctum of the Damned</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#ead7b0;font-family:Georgia,serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#050505}
#boot strong{font-size:22px;color:#f0d2a0}#boot small{display:block;margin-top:8px;color:#a98c68}
</style>
</head>
<body>
<div id="boot"><div><strong>Sanctum of the Damned</strong><small>Loading the sanctum…</small></div></div>
<script>
(async()=>{
 const files=["./parts/dev/10-shell/shell-01.part?v=19","./parts/dev/10-shell/shell-02.part?v=19","./parts/dev/10-shell/shell-03.part?v=19","./parts/game-002.part?v=19","./parts/game-003.part?v=19","./parts/dev/40-gameplay/gameplay-01.part?v=19","./parts/dev/40-gameplay/gameplay-02.part?v=19","./parts/dev/50-tutorial/tutorial-01.part?v=19","./parts/dev/50-tutorial/tutorial-02.part?v=19","./parts/dev/60-run/run-01.part?v=19","./parts/dev/60-run/run-02.part?v=19","./parts/dev/70-priest-ui/priest-ui-01.part?v=19","./parts/dev/80-mobile/mobile-01.part?v=19","./parts/dev/81-mobile-polish/mobile-polish-01.part?v=19","./parts/dev/90-multiplayer/multiplayer-01.part?v=19","./parts/dev/90-multiplayer/multiplayer-02.part?v=19","./parts/dev/90-multiplayer/multiplayer-03.part?v=19","./parts/dev/90-multiplayer/multiplayer-04.part?v=19"];
 try{
   const chunks=[];
   for(const file of files){
     const r=await fetch(file,{cache:'reload'});
     if(!r.ok) throw new Error(file+' '+r.status);
     chunks.push(await r.text());
   }
   const game=chunks.join('\n');
   document.open();
   document.write(game);
   document.close();
 }catch(err){
   document.getElementById('boot').innerHTML='<div><strong>Unable to load Sanctum</strong><small>'+String(err)+'</small></div>';
 }
})();
</script>
</body>
</html>
