name: Focused Laws of Damnation Check

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  laws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check src/js/89-laws-damnation.js
          node --check src/js/10-engine.js
          node --check src/js/30-roguelite.js
          node --check src/js/60-multiplayer.js
          node --check scripts/laws-damnation-smoke.mjs
      - name: Run focused Laws of Damnation checks
        run: node scripts/laws-damnation-smoke.mjs
      - name: Install focused browser test dependency
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Test three-choice startup in the real game browser
        run: |
          python3 -m http.server 4173 >/tmp/sanctum-laws-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/laws-damnation-browser-smoke.mjs
