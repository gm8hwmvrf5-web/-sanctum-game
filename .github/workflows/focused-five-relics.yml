name: Five New Relics Smoke

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  focused-relics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check changed scripts
        run: |
          node --check src/js/10-engine.js
          node --check src/js/30-roguelite.js
          node --check scripts/five-relics-smoke.mjs
          node --check service-worker.js
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Test five Relics in running browser game
        run: |
          python3 -m http.server 4173 >/tmp/sanctum-relics-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/five-relics-smoke.mjs
