name: Focused Ward Priest UI Check

on:
  push:
    branches:
      - multiplayer-clean-rebuild
    paths:
      - 'src/js/80-wards.js'
      - 'src/styles/wards.css'
      - 'scripts/wards-smoke.mjs'
      - 'index.html'
      - '.github/workflows/focused-ward-priest-ui.yml'
  workflow_dispatch:

jobs:
  ward-priest-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean rebuild
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install lightweight browser test dependency
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Test Ward button position and placement
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/sanctum-ward-ui-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/wards-smoke.mjs
