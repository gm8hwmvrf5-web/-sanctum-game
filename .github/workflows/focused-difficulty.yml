name: Focused Difficulty Scaling Check

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  difficulty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean rebuild
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax checks
        run: |
          node --check src/js/10-engine.js
          node --check src/js/30-roguelite.js
          node --check src/js/35-difficulty.js
          node --check service-worker.js
          node --check scripts/difficulty-smoke.mjs
      - name: Focused difficulty and multiplayer regression checks
        run: node scripts/difficulty-smoke.mjs
