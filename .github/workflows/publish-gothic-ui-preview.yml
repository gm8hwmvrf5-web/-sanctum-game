name: Publish Gothic UI Preview

on:
  push:
    branches:
      - gothic-ui-preview
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gothic-ui-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Gothic UI branch
        uses: actions/checkout@v4
        with:
          path: preview
      - name: Checkout existing Pages branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Mirror runtime to an isolated preview URL
        shell: bash
        run: |
          set -euo pipefail
          target="site/gothic-ui-preview"
          rm -rf "$target"
          mkdir -p "$target"
          cp preview/index.html "$target/index.html"
          cp preview/manifest.webmanifest "$target/manifest.webmanifest"
          cp preview/service-worker.js "$target/service-worker.js"
          cp -R preview/src "$target/src"
          cp -R preview/assets "$target/assets"
          cp -R preview/icons "$target/icons"
      - name: Publish only the preview folder
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gothic-ui-preview
          if git diff --cached --quiet; then
            echo "Preview is already current."
            exit 0
          fi
          git commit -m "Publish isolated Gothic UI preview"
          git push origin HEAD:main
