name: Faithful Mockup UI Smoke
on:
  push:
    branches: [gothic-ui-preview]
    paths:
      - 'src/styles/89-mockup-pixel-skin.css'
      - 'src/js/89-mockup-pixel-skin.js'
      - 'assets/ui-gothic/faithful/**'
      - 'scripts/mockup-pixel-smoke.mjs'
      - '.github/workflows/mockup-pixel-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Verify faithful desktop and iPhone UI
        shell: bash
        run: |
          set -euo pipefail
          node --check src/js/89-mockup-pixel-skin.js
          python3 -m http.server 4173 >/tmp/mockup-ui.log 2>&1 &
          sid=$!
          trap 'kill "$sid"' EXIT
          sleep 1
          node scripts/mockup-pixel-smoke.mjs
