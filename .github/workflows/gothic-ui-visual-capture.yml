name: Gothic UI Visual Capture
on:
  push:
    branches: [gothic-ui-preview]
    paths:
      - 'src/js/88-gothic-ui-preview.js'
      - 'src/styles/88-gothic-ui-preview.css'
      - 'src/styles/89-mockup-pixel-skin.css'
      - 'src/styles/90-hud-room-cleanup.css'
      - 'src/styles/91-reference-v2.css'
      - 'src/styles/92-gothic-ui-repair.css'
      - 'src/styles/93-ritual-hand-fix.css'
      - 'src/styles/94-ritual-room-hand-balance.css'
      - 'src/js/92-gothic-ui-repair.js'
      - 'src/js/91-reference-v2.js'
      - 'src/js/90-hud-room-cleanup.js'
      - 'src/js/89-mockup-pixel-skin.js'
      - 'assets/ui-gothic/**'
      - 'scripts/gothic-ui-visual-capture.mjs'
      - '.github/workflows/gothic-ui-visual-capture.yml'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Render desktop and iPhone screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/gothic-visual-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/gothic-ui-visual-capture.mjs
