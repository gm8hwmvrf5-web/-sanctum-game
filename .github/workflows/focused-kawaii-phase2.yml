name: Focused Kawaii Phase 2 Art Checks

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  kawaii-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Phase 2 scripts
        run: |
          node --check src/js/88-skins.js
          node --check src/js/89-kawaii-art.js
          node --check scripts/kawaii-phase2-smoke.mjs
          node --check service-worker.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Check kawaii art and Gothic fallback in browser
        run: |
          python3 -m http.server 4173 >/tmp/sanctum-kawaii-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid"' EXIT
          sleep 1
          node scripts/kawaii-phase2-smoke.mjs
