name: Temporary Boss Layout Screenshot

on:
  push:
    branches:
      - multiplayer-dev
    paths:
      - .github/workflows/boss-layout-screenshot.yml

jobs:
  screenshot:
    if: contains(github.event.head_commit.message, 'Run boss layout screenshot test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Assemble current multiplayer build
        shell: bash
        run: |
          cat parts/game-001.part parts/game-002.part parts/game-003.part parts/game-004.part parts/game-005.part parts/game-006.part parts/game-007.part parts/game-008.part parts/game-009.part parts/game-010.part > /tmp/sanctum-base.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sanctum-base.html')
          html=p.read_text()
          injected=r'''
          <script id="bossScreenshotPlaytest">
          (async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const visible=el=>!!el&&!el.classList.contains('hidden');
            const clickFirstChoice=()=>{
              const modal=document.getElementById('rogueChoiceModal');
              if(!visible(modal))return false;
              const btn=modal.querySelector('[data-rogue-choice]');
              if(!btn)return false;
              btn.click();
              return true;
            };
            try{
              window.alert=()=>{};
              window.confirm=()=>true;
              await sleep(250);
              const count=document.getElementById('playerCount');
              if(count){count.value='1'; if(typeof setupPlayersUI==='function')setupPlayersUI();}
              const timer=document.getElementById('turnTimerSelect');
              if(timer)timer.value='120';
              if(typeof startGame!=='function')throw new Error('startGame unavailable');
              startGame();
              await sleep(350);

              let safety=0;
              while(!(S&&S.bossRevealed)&&safety++<300){
                const choice=document.getElementById('rogueChoiceModal');
                if(visible(choice)){
                  clickFirstChoice();
                  await sleep(180);
                  continue;
                }
                const other=[...document.querySelectorAll('.modal')].find(m=>
                  m.id!=='setupModal'&&m.id!=='rogueChoiceModal'&&!m.classList.contains('hidden')
                );
                if(other){
                  const close=other.querySelector('button');
                  if(close)close.click();
                  else other.classList.add('hidden');
                  await sleep(120);
                  continue;
                }
                const demons=typeof allDemons==='function'?allDemons():[];
                if(demons.length){
                  const target=demons[0].d;
                  if(typeof damageDemon==='function')damageDemon(target,Math.max(999,Number(target.cur||999)),'Automated single-player layout playtest');
                  else if(typeof defeatDemon==='function')defeatDemon(target);
                  await sleep(180);
                  continue;
                }
                if(S?.rogue?.pendingClear){
                  if(typeof rogueliteOpenEncounterReward==='function')rogueliteOpenEncounterReward();
                  await sleep(180);
                  continue;
                }
                if(S?.rogue?.floor>=5&&!S.bossRevealed&&typeof rogueliteEnterCurrentFloor==='function'){
                  rogueliteEnterCurrentFloor('boss');
                  await sleep(250);
                  continue;
                }
                if(typeof spawnOne==='function'){
                  spawnOne(false);
                  await sleep(150);
                  continue;
                }
                await sleep(100);
              }

              if(!S?.bossRevealed)throw new Error('Boss was not reached during automated playtest');
              document.querySelectorAll('.modal').forEach(m=>{
                if(m.id!=='mpDemonReader')m.classList.add('hidden');
              });
              if(typeof render==='function')render();
              await sleep(300);
              window.scrollTo(0,0);

              if(location.hash==='#reader'){
                if(typeof window.__sanctumOpenBossReader==='function')window.__sanctumOpenBossReader();
                await sleep(300);
              }
              document.documentElement.setAttribute('data-boss-shot-ready','1');
              console.log('BOSS_SCREENSHOT_READY',S.boss.n,S.boss.cur,S.boss.hp,S.rogue?.floor);
            }catch(err){
              document.documentElement.setAttribute('data-boss-shot-error',String(err&&err.message||err));
              console.error('BOSS_SCREENSHOT_ERROR',err);
            }
          })();
          </script>
          '''
          if '</body>' not in html:
              raise SystemExit('No closing body tag found')
          html=html.replace('</body>',injected+'\n</body>',1)
          Path('/tmp/sanctum-playtest.html').write_text(html)
          PY

      - name: Capture iPhone landscape boss layouts
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Using $BROWSER"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=874,402 --virtual-time-budget=22000 --screenshot=/tmp/boss-board.png "file:///tmp/sanctum-playtest.html#board"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=874,402 --virtual-time-budget=22000 --screenshot=/tmp/boss-tap-view.png "file:///tmp/sanctum-playtest.html#reader"
          file /tmp/boss-board.png /tmp/boss-tap-view.png
          ls -lh /tmp/boss-board.png /tmp/boss-tap-view.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: boss-layout-screenshots
          path: |
            /tmp/boss-board.png
            /tmp/boss-tap-view.png
          if-no-files-found: error
          retention-days: 1
