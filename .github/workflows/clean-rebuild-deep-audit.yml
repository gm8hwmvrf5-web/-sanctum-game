name: Clean Rebuild Deep Audit

# Deliberately manual: run only when an explicit audit is requested.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean rebuild
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Full Priest, Demon, Boss and mechanics audits
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/sanctum-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/mechanics-audit.mjs
          node scripts/priest-playthrough.mjs
          node scripts/demon-boss-playthrough.mjs
