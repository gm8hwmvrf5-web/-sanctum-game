name: Gothic UI Preview Smoke

on:
  push:
    branches:
      - gothic-ui-preview
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check UI module syntax
        run: |
          node --check src/js/88-gothic-ui-preview.js
          node --check src/js/89-mockup-pixel-skin.js
          node --check src/js/90-hud-room-cleanup.js
          node --check src/js/91-reference-v2.js
          node --check src/js/92-gothic-ui-repair.js
          node --check service-worker.js
      - name: Install browser for two viewport checks
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Test desktop and iPhone landscape
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/gothic-preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/gothic-ui-preview-smoke.mjs
