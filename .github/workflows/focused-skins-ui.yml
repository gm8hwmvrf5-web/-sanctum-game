name: Focused Visual Skins UI

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  skins-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check skin JavaScript syntax
        run: |
          node --check src/js/88-skins.js
          node --check scripts/skins-ui-smoke.mjs
          node --check service-worker.js
      - name: Install browser test
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Verify skin toggle, local persistence, and mobile view
        run: |
          python3 -m http.server 4173 >/tmp/sanctum-skins-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/skins-ui-smoke.mjs
