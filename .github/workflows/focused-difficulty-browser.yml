name: Focused Difficulty Browser UI

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser check
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Setup and mobile landscape difficulty UI check
        run: |
          python3 -m http.server 4173 >/tmp/sanctum-difficulty-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/difficulty-browser-smoke.mjs
