name: Focused Kawaii Phase 3 Art Checks

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  kawaii-phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Phase 3 syntax
        run: |
          node --check src/js/90-kawaii-phase3.js
          node --check src/js/88-skins.js
          node --check scripts/kawaii-phase3-smoke.mjs
          node --check service-worker.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Test Priest cards, Relics, Wards, fallback and mobile
        run: |
          python3 -m http.server 4173 >/tmp/sanctum-kawaii-phase3-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid"' EXIT
          sleep 1
          node scripts/kawaii-phase3-smoke.mjs
