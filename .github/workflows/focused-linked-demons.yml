name: Focused Linked Demons Check

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  linked-demons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Linked Demons script
        run: |
          node --check src/js/88-linked-demons.js
          node --check scripts/linked-demons-smoke.mjs
      - name: Linked Demons focused gameplay checks
        run: node scripts/linked-demons-smoke.mjs
