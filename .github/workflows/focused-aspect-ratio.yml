name: Focused Aspect Ratio Menu

on:
  push:
    branches: [multiplayer-clean-rebuild]
  workflow_dispatch:

jobs:
  aspect-ratio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check src/js/90-aspect-ratio.js
          node --check scripts/aspect-ratio-menu-smoke.mjs
          node --check scripts/full-viewport-board-smoke.mjs
          node --check scripts/priest-brick-background-smoke.mjs
          node --check scripts/main-gothic-background-smoke.mjs
          node --check scripts/popup-centering-smoke.mjs
          node --check scripts/ritual-power-readout-smoke.mjs
          node --check scripts/room-energy-border-smoke.mjs
          node --check scripts/sanctuary-blessing-smoke.mjs
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Verify game menu on desktop, iPhone landscape and tablet
        run: |
          python3 -m http.server 4173 >/tmp/sanctum-aspect-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/aspect-ratio-menu-smoke.mjs
          node scripts/full-viewport-board-smoke.mjs
          node scripts/priest-brick-background-smoke.mjs
          node scripts/main-gothic-background-smoke.mjs
          node scripts/popup-centering-smoke.mjs
          node scripts/ritual-power-readout-smoke.mjs
          node scripts/room-energy-border-smoke.mjs
          node scripts/sanctuary-blessing-smoke.mjs
