name: Clean Rebuild Validation

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean rebuild
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
          echo "Checking service-worker.js"
          node --check service-worker.js
      - name: Structural validation
        run: node scripts/validate-clean-build.mjs
      - name: Install browser smoke-test dependency
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Focused demon ability audit (explicitly requested)
        if: contains(github.event.head_commit.message, '[demon-audit]')
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/sanctum-demon-ability-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/demon-abilities-audit.mjs
      - name: Game startup and multiplayer smoke checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/sanctum-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/smoke-clean-build.mjs
          node scripts/wards-smoke.mjs
          node scripts/wards-mechanics.mjs
          node scripts/repository-after-boss-smoke.mjs
          node scripts/balance-1-0-smoke.mjs
          node scripts/balance-1-1-smoke.mjs
          node scripts/altar-protection-audit.mjs
          node scripts/live-lobby-join.mjs

