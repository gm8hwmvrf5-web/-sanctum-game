name: Clean Rebuild Validation

on:
  push:
    branches:
      - multiplayer-clean-rebuild
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean rebuild
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Structural validation
        run: node scripts/validate-clean-build.mjs
      - name: Install browser smoke-test dependency
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/sanctum-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/smoke-clean-build.mjs
